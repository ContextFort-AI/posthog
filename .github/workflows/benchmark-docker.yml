name: Docker Build Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - benchmark

concurrency:
  group: docker-benchmark-${{ github.run_id }}

permissions:
  contents: read
  id-token: write

# Benchmark: PostHog's production Docker image build
# Compares Depot (cold), Depot (warm/cached), and GitHub-hosted runners.
# amd64 only, no image push — just measuring build time.

jobs:
  # ==========================================================================
  # DEPOT COLD BUILD — first build, populates cache
  # ==========================================================================
  depot-cold:
    name: "[Depot] Docker build (cold)"
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune -af

      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Set up Depot CLI
        uses: depot/setup-action@b0b1ea4f69e92ebf5dea3f8713a1b0c37b2126a5 # v1.6.0

      - name: Build image (cold, populates cache)
        uses: depot/build-push-action@9785b135c3c76c33db102e45be96a25ab55cd507 # v1.16.2
        with:
          context: .
          buildx-fallback: false
          platforms: linux/amd64
          push: false
          build-args: COMMIT_HASH=${{ github.sha }}

  # ==========================================================================
  # DEPOT WARM BUILD — runs after cold build, should hit cached layers
  # ==========================================================================
  depot-warm:
    name: "[Depot] Docker build (warm/cached)"
    needs: depot-cold
    runs-on: depot-ubuntu-latest-4
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune -af

      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Set up Depot CLI
        uses: depot/setup-action@b0b1ea4f69e92ebf5dea3f8713a1b0c37b2126a5 # v1.6.0

      - name: Build image (warm, using cache)
        uses: depot/build-push-action@9785b135c3c76c33db102e45be96a25ab55cd507 # v1.16.2
        with:
          context: .
          buildx-fallback: false
          platforms: linux/amd64
          push: false
          build-args: COMMIT_HASH=${{ github.sha }}

  # ==========================================================================
  # GITHUB RUNNER — standard docker buildx build, no Depot
  # ==========================================================================
  github-buildx:
    name: "[GitHub] Docker build (buildx)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune -af

      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: COMMIT_HASH=${{ github.sha }}
