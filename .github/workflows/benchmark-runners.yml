name: Runner Benchmark v2

on:
  workflow_dispatch:
  push:
    branches:
      - benchmark

concurrency:
  group: benchmark-${{ github.run_id }}

permissions:
  contents: read

# This is PostHog's actual ci-frontend.yml workflow duplicated to run on
# both Depot runners (original) and GitHub-hosted runners (comparison).
# No path filtering — always runs all jobs.

jobs:
  # ==========================================================================
  # FRONTEND FORMATTING — PostHog's actual job
  # ==========================================================================
  depot-frontend-format:
    name: "[Depot] Frontend formatting"
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Fix node-gyp permissions
        run: chmod +x ~/setup-pnpm/node_modules/.pnpm/pnpm@*/node_modules/pnpm/dist/node_modules/node-gyp/gyp/gyp_main.py

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.13.0
          cache: 'pnpm'

      - name: Install package.json dependencies with pnpm
        run: |
          pnpm --filter=@posthog/playwright... install --frozen-lockfile
          bin/turbo --filter=@posthog/frontend prepare

      - name: Check formatting with oxfmt
        run: pnpm run format:frontend:check

      - name: Lint with Stylelint
        run: pnpm run lint:css

      - name: Lint with Oxlint
        run: pnpm exec oxlint --quiet

      - name: Check markdown formatting with oxfmt
        run: pnpm exec oxfmt --check "**/*.{md,mdx}"

      - name: Check YAML formatting with oxfmt
        run: pnpm exec oxfmt --check "**/*.{yaml,yml}"

      - name: Lint markdown files
        run: pnpm exec markdownlint-cli2 --config .config/.markdownlint-cli2.jsonc "**/*.{md,mdx}"

  github-frontend-format:
    name: "[GitHub] Frontend formatting"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Fix node-gyp permissions
        run: chmod +x ~/setup-pnpm/node_modules/.pnpm/pnpm@*/node_modules/pnpm/dist/node_modules/node-gyp/gyp/gyp_main.py

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.13.0
          cache: 'pnpm'

      - name: Install package.json dependencies with pnpm
        run: |
          pnpm --filter=@posthog/playwright... install --frozen-lockfile
          bin/turbo --filter=@posthog/frontend prepare

      - name: Check formatting with oxfmt
        run: pnpm run format:frontend:check

      - name: Lint with Stylelint
        run: pnpm run lint:css

      - name: Lint with Oxlint
        run: pnpm exec oxlint --quiet

      - name: Check markdown formatting with oxfmt
        run: pnpm exec oxfmt --check "**/*.{md,mdx}"

      - name: Check YAML formatting with oxfmt
        run: pnpm exec oxfmt --check "**/*.{yaml,yml}"

      - name: Lint markdown files
        run: pnpm exec markdownlint-cli2 --config .config/.markdownlint-cli2.jsonc "**/*.{md,mdx}"

  # ==========================================================================
  # FRONTEND TYPECHECKING — PostHog's actual job
  # ==========================================================================
  depot-frontend-typescript:
    name: "[Depot] Frontend typechecking"
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Fix node-gyp permissions
        run: chmod +x ~/setup-pnpm/node_modules/.pnpm/pnpm@*/node_modules/pnpm/dist/node_modules/node-gyp/gyp/gyp_main.py

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.13.0
          cache: 'pnpm'

      - name: Install package.json dependencies with pnpm
        run: |
          pnpm --filter=@posthog/playwright... install --no-frozen-lockfile
          bin/turbo --filter=@posthog/frontend prepare

      - name: Build products
        run: pnpm --filter=@posthog/frontend build:products

      - name: Kea typegen
        run: pnpm --filter=@posthog/frontend typegen:write

      - name: Re-format files after typegen
        run: pnpm exec oxfmt "./{products,frontend/src}/**/*.{ts,tsx}"

      - name: Run typescript with strict
        run: pnpm --filter=@posthog/frontend typescript:check
        env:
          NODE_OPTIONS: --max-old-space-size=16384

      - name: Check if schema.json and validators.js are up to date
        run: pnpm --filter=@posthog/frontend schema:build:json && git diff --exit-code
        continue-on-error: true

      - name: Check if mobile replay schema.json is up to date
        run: pnpm --filter=@posthog/frontend mobile-replay:schema:build:json && git diff --exit-code
        continue-on-error: true

      - name: Validate SetupTaskId completions
        run: node bin/validate-setup-tasks.mjs
        continue-on-error: true

  github-frontend-typescript:
    name: "[GitHub] Frontend typechecking"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Fix node-gyp permissions
        run: chmod +x ~/setup-pnpm/node_modules/.pnpm/pnpm@*/node_modules/pnpm/dist/node_modules/node-gyp/gyp/gyp_main.py

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.13.0
          cache: 'pnpm'

      - name: Install package.json dependencies with pnpm
        run: |
          pnpm --filter=@posthog/playwright... install --no-frozen-lockfile
          bin/turbo --filter=@posthog/frontend prepare

      - name: Build products
        run: pnpm --filter=@posthog/frontend build:products

      - name: Kea typegen
        run: pnpm --filter=@posthog/frontend typegen:write

      - name: Re-format files after typegen
        run: pnpm exec oxfmt "./{products,frontend/src}/**/*.{ts,tsx}"

      - name: Run typescript with strict
        run: pnpm --filter=@posthog/frontend typescript:check
        env:
          NODE_OPTIONS: --max-old-space-size=16384

      - name: Check if schema.json and validators.js are up to date
        run: pnpm --filter=@posthog/frontend schema:build:json && git diff --exit-code
        continue-on-error: true

      - name: Check if mobile replay schema.json is up to date
        run: pnpm --filter=@posthog/frontend mobile-replay:schema:build:json && git diff --exit-code
        continue-on-error: true

      - name: Validate SetupTaskId completions
        run: node bin/validate-setup-tasks.mjs
        continue-on-error: true

  # ==========================================================================
  # JEST TESTS — PostHog's actual job (single shard for benchmark)
  # ==========================================================================
  depot-jest:
    name: "[Depot] Jest test (FOSS - 1)"
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Fix node-gyp permissions
        run: chmod +x ~/setup-pnpm/node_modules/.pnpm/pnpm@*/node_modules/pnpm/dist/node_modules/node-gyp/gyp/gyp_main.py

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install package.json dependencies with pnpm
        run: pnpm --filter=@posthog/frontend... install --frozen-lockfile

      - name: Test with Jest
        run: bin/turbo run test --filter=@posthog/frontend -- --runInBand
        env:
          NODE_OPTIONS: --max-old-space-size=16384
          SHARD_INDEX: 1
          SHARD_COUNT: 3

  github-jest:
    name: "[GitHub] Jest test (FOSS - 1)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Fix node-gyp permissions
        run: chmod +x ~/setup-pnpm/node_modules/.pnpm/pnpm@*/node_modules/pnpm/dist/node_modules/node-gyp/gyp/gyp_main.py

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Install package.json dependencies with pnpm
        run: pnpm --filter=@posthog/frontend... install --frozen-lockfile

      - name: Test with Jest
        run: bin/turbo run test --filter=@posthog/frontend -- --runInBand
        env:
          NODE_OPTIONS: --max-old-space-size=16384
          SHARD_INDEX: 1
          SHARD_COUNT: 3
