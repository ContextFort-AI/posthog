          echo "=========================================="

  # ==========================================================================
  # BENCHMARK 5: Frontend lint (lighter task) - GitHub vs Depot
  # ==========================================================================
  github-lint:
    name: "[GitHub] Frontend Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Record start time
        run: echo "START_TIME=$(date +%s%N)" >> $GITHUB_ENV

