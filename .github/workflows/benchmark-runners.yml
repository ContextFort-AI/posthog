        run: echo "INSTALL_TIME=$(date +%s%N)" >> $GITHUB_ENV

      - name: Prepare
        run: bin/turbo --filter=@posthog/frontend prepare

      - name: Oxlint
        run: pnpm exec oxlint --quiet
        continue-on-error: true

      - name: Record lint done
        run: echo "LINT_TIME=$(date +%s%N)" >> $GITHUB_ENV

      - name: Print timing summary
        run: |
          echo "=========================================="
          echo "  BENCHMARK: GitHub runner - Lint"
          echo "=========================================="
          start=${{ env.START_TIME }}
          install=${{ env.INSTALL_TIME }}
          lint=${{ env.LINT_TIME }}
          echo "Setup+Install: $(( (install - start) / 1000000 ))ms"
          echo "Lint:          $(( (lint - install) / 1000000 ))ms"
          echo "TOTAL:         $(( (lint - start) / 1000000 ))ms"
          echo "=========================================="

